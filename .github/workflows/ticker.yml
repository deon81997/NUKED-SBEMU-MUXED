# Rebuilds the README's scrolling news ticker whenever README.md changes, from the newest "What's NEW!!"
# entries (docs/90s/ticker_news.py), and adds it to the "ticker" branch: main does not take pushes from the
# Actions bot (repository rule), and the ticker branch must already exist (the bot may not create branches). The README shows
#   https://raw.githubusercontent.com/deon81997/NUKED-SBEMU-MUXED/ticker/ticker-hd.gif
name: News ticker

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/90s/ticker_news.py'
      - 'docs/90s/nav90s.py'
      - '.github/workflows/ticker.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticker
  cancel-in-progress: true

jobs:
  ticker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pillow and the DejaVu fonts
        run: |
          sudo apt-get install -y -q fonts-dejavu-core > /dev/null
          pip install -q pillow
      - name: The ticker branch as it is now
        run: git clone -q --depth 1 -b ticker "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$RUNNER_TEMP/t"
      - name: Rebuild the ticker
        id: build
        run: |
          python3 docs/90s/ticker_news.py "$RUNNER_TEMP/t" | tee "$RUNNER_TEMP/out.txt"
          grep -q '^unchanged' "$RUNNER_TEMP/out.txt" && echo "changed=0" >> "$GITHUB_OUTPUT" || echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Publish it on the ticker branch
        if: steps.build.outputs.changed == '1'
        run: |
          cd "$RUNNER_TEMP/t"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ticker-hd.gif ticker-hd.txt
          git commit -q -m "News ticker: $(cat ticker-hd.txt | cut -c1-120)"
          git push -q origin ticker      # a normal push: the branch rules forbid force-pushes
